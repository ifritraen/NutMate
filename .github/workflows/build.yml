name: NutMate CI/CD Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release NutMate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Split-ABI Release APKs
        run: flutter build apk --split-per-abi

      - name: Rename APKs with Version and ABI
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              abi=$(echo "$f" | sed -e 's/app-//' -e 's/-release.apk//')
              mv "$f" "NutMate_v1.0.0_${abi}-release.apk"
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NutMate_v1.0.0_APKs
          path: build/app/outputs/flutter-apk/NutMate_v1.0.0_*-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: NutMate_v1.0.0
          name: NutMate v1.0.0
          body: |
            ## NutMate v1.0.0 Release 🚀
            
            ### Included Build APKs:
            * **`arm64-v8a`**: `NutMate_v1.0.0_arm64-v8a-release.apk` (Recommended for modern 64-bit devices)
            * **`armeabi-v7a`**: `NutMate_v1.0.0_armeabi-v7a-release.apk` (32-bit devices)
            * **`x86_64`**: `NutMate_v1.0.0_x86_64-release.apk` (Emulators & 64-bit x86 devices)
          files: build/app/outputs/flutter-apk/NutMate_v1.0.0_*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
