name: NutMate CI/CD Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release NutMate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Extract App Version from pubspec.yaml
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore Consistent Release Signing Keystore
        run: |
          mkdir -p android/app
          base64 -d .github/workflows/upload-keystore.b64 > android/app/upload-keystore.jks

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Split-ABI Release APKs
        run: flutter build apk --split-per-abi

      - name: Rename APKs with Version and ABI
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              abi=$(echo "$f" | sed -e 's/app-//' -e 's/-release.apk//')
              mv "$f" "NutMate_v${VERSION}_${abi}-release.apk"
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NutMate_v${{ env.VERSION }}_APKs
          path: build/app/outputs/flutter-apk/NutMate_v*_*-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: NutMate v${{ env.VERSION }}
          body: |
            ## NutMate v${{ env.VERSION }} Release 🚀
            
            ### Included Build APKs:
            * **`arm64-v8a`**: `NutMate_v${{ env.VERSION }}_arm64-v8a-release.apk` (Recommended for modern 64-bit devices)
            * **`armeabi-v7a`**: `NutMate_v${{ env.VERSION }}_armeabi-v7a-release.apk` (32-bit devices)
            * **`x86_64`**: `NutMate_v${{ env.VERSION }}_x86_64-release.apk` (Emulators & 64-bit x86 devices)
          files: build/app/outputs/flutter-apk/NutMate_v*_*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
